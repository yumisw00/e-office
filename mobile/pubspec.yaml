name: e_office_mobile
description: "Aplikasi E-Office Mobile untuk PT ABC - Alat Kerja Pimpinan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State Management - Versi stabil tanpa generator
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1

  # Routing
  go_router: ^17.3.0

  # HTTP Client
  dio: ^5.9.2

  # Local Storage
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.2.3

  # Firebase (FCM for Notifikasi Real-time)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local Notifications (untuk notifikasi di Android/iOS)
  flutter_local_notifications: ^18.0.1

  # UI & Utils
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  intl: ^0.19.0
  device_info_plus: ^11.2.0
  
  # Theme
  flex_color_scheme: ^8.0.0
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^28.1.33

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
