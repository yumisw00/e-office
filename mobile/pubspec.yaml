name: e_office_mobile
description: "Aplikasi E-Office Mobile untuk PT ABC - Alat Kerja Pimpinan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.3.0

  # HTTP Client
  dio: ^5.9.2

  # Local Storage
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.2.3

  # Firebase (FCM for Notifikasi Real-time)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  
  # Local Notifications (untuk notifikasi di Android/iOS)
  flutter_local_notifications: ^18.0.1

  # UI & Utils
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  intl: ^0.20.2
  syncfusion_flutter_pdfviewer: ^33.2.10
  qr_flutter: ^4.1.0
  flex_color_scheme: ^8.4.0
  flutter_animate: ^4.5.2
  figma_squircle: ^0.6.3
  
  # Biometric Authentication (Digital Signature)
  local_auth: ^2.3.0
  
  # Image Picker (Upload Attachment Disposisi)
  image_picker: ^1.1.2
  
  # Share/Print Dokumen
  share_plus: ^10.1.2
  printing: ^5.14.1
  
  # Device Info (untuk mendapatkan info perangkat saat login)
  device_info_plus: ^12.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
